<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ستريمي | منصة فيديو</title>

<!-- ======================================================
     Firebase SDK (compat build – سهل الاستخدام بدون Bundler)
====================================================== -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<style>
:root{
  --bg:#0f0f0f;
  --bg-elevated:#181818;
  --bg-card:#1c1c1c;
  --border:#2c2c2c;
  --text:#f1f1f1;
  --text-dim:#aaaaaa;
  --accent:#e5322d;      /* أحمر ستريمي */
  --accent-hover:#ff453f;
  --radius:12px;
  font-family:'Segoe UI',Tahoma,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--bg);color:var(--text);}
body{overflow-x:hidden;}
img{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#3a3a3a;border-radius:4px;}

/* ---------- Header ---------- */
header{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;gap:16px;
  padding:10px 20px;background:var(--bg);
  border-bottom:1px solid var(--border);
}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;flex-shrink:0;}
.logo .badge{
  background:var(--accent);color:#fff;width:34px;height:24px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;font-size:14px;
}
.menu-btn{background:none;color:var(--text);font-size:20px;padding:8px;border-radius:50%;}
.menu-btn:hover{background:var(--bg-elevated);}
.search-wrap{flex:1;display:flex;justify-content:center;max-width:640px;margin:0 auto;}
.search-form{display:flex;flex:1;}
.search-form input{
  flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text);
  padding:8px 16px;border-radius:20px 0 0 20px;outline:none;font-size:15px;
}
.search-form input:focus{border-color:#5a5a5a;}
.search-form button{
  background:var(--bg-elevated);border:1px solid var(--border);border-right:none;
  padding:0 18px;border-radius:0 20px 20px 0;color:var(--text);
}
.header-right{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.icon-btn{
  background:var(--bg-elevated);color:var(--text);width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:18px;
}
.icon-btn:hover{background:#272727;}
.btn{
  background:var(--accent);color:#fff;padding:9px 18px;border-radius:18px;font-weight:600;font-size:14px;
}
.btn:hover{background:var(--accent-hover);}
.btn-outline{
  background:transparent;border:1px solid var(--border);color:var(--text);
  padding:8px 16px;border-radius:18px;font-weight:600;display:flex;align-items:center;gap:6px;
}
.avatar{
  width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;overflow:hidden;
}
.avatar img{width:100%;height:100%;object-fit:cover;}

/* ---------- Layout ---------- */
.layout{display:flex;}
.sidebar{
  width:230px;flex-shrink:0;padding:12px 10px;position:sticky;top:57px;
  height:calc(100vh - 57px);overflow-y:auto;
}
.sidebar a{
  display:flex;align-items:center;gap:20px;padding:10px 14px;border-radius:10px;
  font-size:14px;color:var(--text);
}
.sidebar a:hover{background:var(--bg-elevated);}
.sidebar a.active{background:var(--bg-elevated);font-weight:700;}
.sidebar hr{border:none;border-top:1px solid var(--border);margin:10px 6px;}
.sidebar .section-title{padding:14px 14px 6px;font-size:13px;color:var(--text-dim);font-weight:700;}

main{flex:1;padding:24px 28px;min-width:0;}

/* ---------- Video grid ---------- */
.grid{
  display:grid;gap:24px 16px;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
}
.card{cursor:pointer;}
.thumb-wrap{
  position:relative;border-radius:var(--radius);overflow:hidden;background:#000;
  aspect-ratio:16/9;
}
.thumb-wrap img,.thumb-wrap video{width:100%;height:100%;object-fit:cover;}
.duration{
  position:absolute;bottom:6px;left:6px;background:rgba(0,0,0,.8);color:#fff;
  font-size:12px;padding:2px 6px;border-radius:4px;
}
.card-info{display:flex;gap:10px;margin-top:10px;}
.card-info .avatar{flex-shrink:0;}
.card-title{font-size:15px;font-weight:600;line-height:1.3;max-height:40px;overflow:hidden;}
.card-meta{font-size:13px;color:var(--text-dim);margin-top:4px;}

.empty-state{
  text-align:center;padding:80px 20px;color:var(--text-dim);
}
.empty-state h2{color:var(--text);margin-bottom:8px;font-size:22px;}

/* ---------- Watch page ---------- */
.watch-layout{display:flex;gap:24px;align-items:flex-start;}
.watch-main{flex:1;min-width:0;}
.player-wrap{
  width:100%;aspect-ratio:16/9;background:#000;border-radius:var(--radius);overflow:hidden;
}
.player-wrap video{width:100%;height:100%;}
.watch-title{font-size:19px;font-weight:700;margin:14px 0 10px;}
.watch-sub-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--border);}
.channel-row{display:flex;align-items:center;gap:12px;}
.channel-name{font-weight:700;font-size:15px;}
.action-row{display:flex;gap:10px;}
.description-box{
  background:var(--bg-elevated);border-radius:var(--radius);padding:14px 16px;margin-top:14px;font-size:14px;line-height:1.6;
}
.description-box .stats{color:var(--text-dim);font-weight:600;margin-bottom:8px;}

.comments-section{margin-top:24px;}
.comment-form{display:flex;gap:12px;margin-bottom:20px;}
.comment-form input{
  flex:1;background:transparent;border:none;border-bottom:1px solid var(--border);
  color:var(--text);padding:8px 4px;outline:none;font-size:14px;
}
.comment{display:flex;gap:12px;margin-bottom:18px;}
.comment-body strong{font-size:13px;}
.comment-body p{font-size:14px;margin-top:2px;}
.comment-body time{font-size:12px;color:var(--text-dim);margin-right:8px;}

.watch-sidebar{width:360px;flex-shrink:0;display:flex;flex-direction:column;gap:10px;}
.mini-card{display:flex;gap:8px;cursor:pointer;}
.mini-thumb{width:160px;flex-shrink:0;border-radius:8px;overflow:hidden;aspect-ratio:16/9;background:#000;}
.mini-thumb img{width:100%;height:100%;object-fit:cover;}
.mini-title{font-size:13px;font-weight:600;line-height:1.3;}
.mini-meta{font-size:12px;color:var(--text-dim);margin-top:4px;}

/* ---------- Modal ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;
  display:none;align-items:center;justify-content:center;padding:20px;
}
.overlay.show{display:flex;}
.modal{
  background:var(--bg-elevated);border-radius:var(--radius);width:100%;max-width:480px;
  max-height:90vh;overflow-y:auto;padding:22px;
}
.modal h2{margin-bottom:16px;font-size:18px;}
.modal .close-x{float:left;background:none;color:var(--text-dim);font-size:20px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:13px;color:var(--text-dim);margin-bottom:6px;}
.field input,.field textarea{
  width:100%;background:var(--bg-card);border:1px solid var(--border);color:var(--text);
  padding:10px 12px;border-radius:8px;outline:none;font-size:14px;font-family:inherit;
}
.field textarea{resize:vertical;min-height:70px;}
.field input[type=file]{padding:8px;}
.progress-bar{height:6px;background:var(--bg-card);border-radius:4px;overflow:hidden;margin-top:8px;display:none;}
.progress-bar .fill{height:100%;width:0%;background:var(--accent);transition:width .2s;}
.hint{font-size:12px;color:var(--text-dim);margin-top:6px;}
.error-text{color:var(--accent-hover);font-size:13px;margin-top:6px;display:none;}

.toast{
  position:fixed;bottom:24px;right:24px;background:#212121;border:1px solid var(--border);
  color:var(--text);padding:12px 18px;border-radius:8px;z-index:200;display:none;font-size:14px;
}

@media(max-width:900px){
  .sidebar{display:none;}
  .watch-layout{flex-direction:column;}
  .watch-sidebar{width:100%;}
  main{padding:16px;}
  .search-wrap{display:none;}
}
</style>
</head>
<body>

<!-- ============ HEADER ============ -->
<header>
  <button class="menu-btn" onclick="document.querySelector('.sidebar').classList.toggle('force-show')">☰</button>
  <div class="logo" onclick="goHome()" style="cursor:pointer">
    <span class="badge">▶</span> ستريمي
  </div>
  <div class="search-wrap">
    <form class="search-form" onsubmit="return doSearch(event)">
      <input id="searchInput" type="text" placeholder="ابحث عن فيديوهات...">
      <button type="submit">🔍</button>
    </form>
  </div>
  <div class="header-right" id="headerRight">
    <!-- يتغير حسب حالة تسجيل الدخول -->
  </div>
</header>

<div class="layout">
  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar">
    <a href="#" onclick="goHome();return false;" class="active" id="nav-home">🏠 الرئيسية</a>
    <a href="#" onclick="loadFeed('trending');return false;">🔥 الأكثر مشاهدة</a>
    <a href="#" onclick="requireAuth(()=>loadFeed('subs'));return false;">📺 الاشتراكات</a>
    <hr>
    <div class="section-title">أنت</div>
    <a href="#" onclick="requireAuth(()=>loadFeed('mine'));return false;">🎬 فيديوهاتي</a>
    <a href="#" onclick="requireAuth(()=>loadFeed('liked'));return false;">👍 أعجبني</a>
  </aside>

  <!-- ============ MAIN ============ -->
  <main id="mainContent">
    <div class="empty-state">
      <h2>جارِ التحميل...</h2>
    </div>
  </main>
</div>

<!-- ============ UPLOAD MODAL ============ -->
<div class="overlay" id="uploadOverlay">
  <div class="modal">
    <button class="close-x" onclick="closeUpload()">✕</button>
    <h2>رفع فيديو جديد</h2>
    <form id="uploadForm" onsubmit="return handleUpload(event)">
      <div class="field">
        <label>ملف الفيديو</label>
        <input type="file" id="videoFile" accept="video/*" required>
      </div>
      <div class="field">
        <label>صورة مصغّرة (اختياري - سيتم أخذ لقطة تلقائية إن لم تُحدد)</label>
        <input type="file" id="thumbFile" accept="image/*">
      </div>
      <div class="field">
        <label>العنوان</label>
        <input type="text" id="videoTitle" maxlength="100" required>
      </div>
      <div class="field">
        <label>الوصف</label>
        <textarea id="videoDesc" maxlength="1000"></textarea>
      </div>
      <div class="progress-bar" id="progressBar"><div class="fill" id="progressFill"></div></div>
      <p class="error-text" id="uploadError"></p>
      <button type="submit" class="btn" style="width:100%;padding:12px;margin-top:6px;" id="uploadSubmitBtn">نشر</button>
    </form>
  </div>
</div>

<!-- ============ AUTH MODAL ============ -->
<div class="overlay" id="authOverlay">
  <div class="modal">
    <button class="close-x" onclick="closeAuth()">✕</button>
    <h2 id="authTitle">تسجيل الدخول</h2>
    <form id="authForm" onsubmit="return handleAuth(event)">
      <div class="field" id="nameField" style="display:none">
        <label>اسم القناة</label>
        <input type="text" id="authName">
      </div>
      <div class="field">
        <label>البريد الإلكتروني</label>
        <input type="email" id="authEmail" required>
      </div>
      <div class="field">
        <label>كلمة المرور</label>
        <input type="password" id="authPassword" minlength="6" required>
      </div>
      <p class="error-text" id="authError"></p>
      <button type="submit" class="btn" style="width:100%;padding:12px;">دخول</button>
    </form>
    <p style="text-align:center;margin-top:14px;font-size:13px;color:var(--text-dim);">
      <a href="#" onclick="toggleAuthMode();return false;" id="authToggle">ليس لديك حساب؟ أنشئ واحداً</a>
    </p>
    <div style="text-align:center;margin-top:10px;">
      <button type="button" class="btn-outline" style="width:100%;justify-content:center;" onclick="googleSignIn()">تسجيل الدخول بحساب Google</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   ⚙️  إعدادات Firebase  — ضع بياناتك هنا (من Firebase Console > Project Settings)
===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyB6_HkPcbAhyZG8joikJr_kPK-6UACxldg",
  authDomain: "plat-form-97b8d.firebaseapp.com",
  projectId: "plat-form-97b8d",
  storageBucket: "",
  messagingSenderId: "",
  appId: ""
};

/* =====================================================================
   ⚙️  إعدادات Cloudinary — ضع بياناتك هنا (من Cloudinary Dashboard)
   ملاحظة: upload_preset يجب أن يكون "Unsigned" من Settings > Upload
===================================================================== */
const CLOUDINARY_CLOUD_NAME = "";     // مثال: "dxxxxxx"
const CLOUDINARY_UPLOAD_PRESET = "";  // مثال: "streami_unsigned"

/* ===================================================================== */

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;
let currentView = 'home';
let allVideosCache = [];

/* ---------- Helpers ---------- */
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.style.display='none', 3000);
}
function initials(name){
  return (name||'؟').trim().charAt(0).toUpperCase();
}
function timeAgo(date){
  if(!date) return '';
  const s = Math.floor((Date.now() - date.getTime())/1000);
  const units = [['سنة',31536000],['شهر',2592000],['أسبوع',604800],['يوم',86400],['ساعة',3600],['دقيقة',60]];
  for(const [label,secs] of units){
    const val = Math.floor(s/secs);
    if(val>=1) return `منذ ${val} ${label}${val>1&&val<11?'ات':''}`;
  }
  return 'الآن';
}
function fmtViews(n){
  n = n||0;
  if(n>=1000000) return (n/1000000).toFixed(1)+'م مشاهدة';
  if(n>=1000) return (n/1000).toFixed(1)+'ألف مشاهدة';
  return n+' مشاهدة';
}
function checkConfig(){
  if(!firebaseConfig.apiKey || !firebaseConfig.projectId){
    document.getElementById('mainContent').innerHTML = `
      <div class="empty-state">
        <h2>الإعدادات غير مكتملة ⚠️</h2>
        <p>افتح ملف index.html وأضف بيانات Firebase و Cloudinary في أعلى قسم &lt;script&gt; (متغيرات firebaseConfig و CLOUDINARY_CLOUD_NAME و CLOUDINARY_UPLOAD_PRESET).</p>
      </div>`;
    return false;
  }
  return true;
}

/* ---------- Auth UI ---------- */
let authMode = 'login';
function openAuth(){ document.getElementById('authOverlay').classList.add('show'); }
function closeAuth(){ document.getElementById('authOverlay').classList.remove('show'); document.getElementById('authError').style.display='none'; }
function toggleAuthMode(){
  authMode = authMode==='login' ? 'signup' : 'login';
  document.getElementById('authTitle').textContent = authMode==='login' ? 'تسجيل الدخول' : 'إنشاء حساب';
  document.getElementById('nameField').style.display = authMode==='signup' ? 'block' : 'none';
  document.getElementById('authToggle').textContent = authMode==='login' ? 'ليس لديك حساب؟ أنشئ واحداً' : 'لديك حساب بالفعل؟ سجّل الدخول';
}
async function handleAuth(e){
  e.preventDefault();
  const email = document.getElementById('authEmail').value.trim();
  const pass = document.getElementById('authPassword').value;
  const name = document.getElementById('authName').value.trim();
  const errEl = document.getElementById('authError');
  errEl.style.display='none';
  try{
    if(authMode==='signup'){
      const cred = await auth.createUserWithEmailAndPassword(email, pass);
      await cred.user.updateProfile({displayName: name || email.split('@')[0]});
      await db.collection('users').doc(cred.user.uid).set({
        name: name || email.split('@')[0], email, createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    } else {
      await auth.signInWithEmailAndPassword(email, pass);
    }
    closeAuth();
    toast('تم تسجيل الدخول بنجاح');
  }catch(err){
    errEl.textContent = translateAuthError(err.code) || err.message;
    errEl.style.display='block';
  }
  return false;
}
async function googleSignIn(){
  try{
    const provider = new firebase.auth.GoogleAuthProvider();
    const res = await auth.signInWithPopup(provider);
    await db.collection('users').doc(res.user.uid).set({
      name: res.user.displayName, email: res.user.email,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    }, {merge:true});
    closeAuth();
    toast('تم تسجيل الدخول بنجاح');
  }catch(err){ toast(err.message); }
}
function translateAuthError(code){
  const map = {
    'auth/email-already-in-use':'هذا البريد مستخدم بالفعل',
    'auth/invalid-email':'بريد إلكتروني غير صالح',
    'auth/weak-password':'كلمة المرور ضعيفة (6 أحرف على الأقل)',
    'auth/user-not-found':'لا يوجد حساب بهذا البريد',
    'auth/wrong-password':'كلمة مرور غير صحيحة',
    'auth/invalid-credential':'بيانات الدخول غير صحيحة'
  };
  return map[code];
}
function requireAuth(cb){
  if(currentUser){ cb(); } else { openAuth(); }
}

auth.onAuthStateChanged(user=>{
  currentUser = user;
  renderHeaderRight();
  if(currentView==='mine' || currentView==='subs' || currentView==='liked'){
    loadFeed(currentView);
  }
});

function renderHeaderRight(){
  const el = document.getElementById('headerRight');
  if(currentUser){
    el.innerHTML = `
      <button class="icon-btn" title="رفع فيديو" onclick="openUpload()">⬆️</button>
      <div class="avatar" title="${currentUser.displayName||''}" onclick="userMenu()">
        ${currentUser.photoURL ? `<img src="${currentUser.photoURL}">` : initials(currentUser.displayName)}
      </div>`;
  } else {
    el.innerHTML = `<button class="btn-outline" onclick="openAuth()">👤 تسجيل الدخول</button>`;
  }
}
function userMenu(){
  if(confirm('تسجيل الخروج؟')){ auth.signOut(); toast('تم تسجيل الخروج'); }
}

/* ---------- Upload ---------- */
function openUpload(){
  if(!checkConfig()) return;
  document.getElementById('uploadOverlay').classList.add('show');
}
function closeUpload(){
  document.getElementById('uploadOverlay').classList.remove('show');
  document.getElementById('uploadForm').reset();
  document.getElementById('progressBar').style.display='none';
  document.getElementById('progressFill').style.width='0%';
}

function cloudinaryUpload(file, resourceType, onProgress){
  return new Promise((resolve, reject)=>{
    if(!CLOUDINARY_CLOUD_NAME || !CLOUDINARY_UPLOAD_PRESET){
      reject(new Error('إعدادات Cloudinary ناقصة'));
      return;
    }
    const url = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/${resourceType}/upload`;
    const fd = new FormData();
    fd.append('file', file);
    fd.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
    const xhr = new XMLHttpRequest();
    xhr.open('POST', url);
    xhr.upload.onprogress = (e)=>{
      if(e.lengthComputable && onProgress) onProgress(Math.round((e.loaded/e.total)*100));
    };
    xhr.onload = ()=>{
      if(xhr.status>=200 && xhr.status<300){ resolve(JSON.parse(xhr.responseText)); }
      else reject(new Error('فشل الرفع: '+xhr.responseText));
    };
    xhr.onerror = ()=>reject(new Error('خطأ في الاتصال بـ Cloudinary'));
    xhr.send(fd);
  });
}

async function handleUpload(e){
  e.preventDefault();
  if(!currentUser){ openAuth(); return false; }
  const videoFile = document.getElementById('videoFile').files[0];
  const thumbFile = document.getElementById('thumbFile').files[0];
  const title = document.getElementById('videoTitle').value.trim();
  const desc = document.getElementById('videoDesc').value.trim();
  const errEl = document.getElementById('uploadError');
  const btn = document.getElementById('uploadSubmitBtn');
  const bar = document.getElementById('progressBar');
  const fill = document.getElementById('progressFill');
  errEl.style.display='none';

  if(!videoFile){ errEl.textContent='اختر ملف فيديو'; errEl.style.display='block'; return false; }

  btn.disabled = true; btn.textContent='جارِ الرفع...'; bar.style.display='block';
  try{
    const videoRes = await cloudinaryUpload(videoFile, 'video', p=>{ fill.style.width = p+'%'; });
    let thumbUrl = videoRes.secure_url.replace(/\.[^/.]+$/, '.jpg'); // لقطة تلقائية من Cloudinary
    if(thumbFile){
      const thumbRes = await cloudinaryUpload(thumbFile, 'image');
      thumbUrl = thumbRes.secure_url;
    }
    await db.collection('videos').add({
      title, description: desc,
      videoUrl: videoRes.secure_url,
      thumbUrl,
      duration: videoRes.duration || 0,
      ownerId: currentUser.uid,
      ownerName: currentUser.displayName || 'مستخدم',
      ownerPhoto: currentUser.photoURL || null,
      views: 0, likes: 0,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    toast('تم نشر الفيديو بنجاح 🎉');
    closeUpload();
    goHome();
  }catch(err){
    errEl.textContent = err.message;
    errEl.style.display='block';
  }finally{
    btn.disabled=false; btn.textContent='نشر';
  }
  return false;
}

/* ---------- Feed rendering ---------- */
function goHome(){ document.getElementById('searchInput').value=''; loadFeed('home'); }

function fmtDuration(sec){
  sec = Math.round(sec||0);
  const m = Math.floor(sec/60), s = sec%60;
  return `${m}:${s.toString().padStart(2,'0')}`;
}

function videoCardHtml(v){
  return `
    <div class="card" onclick="openVideo('${v.id}')">
      <div class="thumb-wrap">
        <img src="${v.thumbUrl}" onerror="this.style.display='none'">
        <span class="duration">${fmtDuration(v.duration)}</span>
      </div>
      <div class="card-info">
        <div class="avatar">${v.ownerPhoto?`<img src="${v.ownerPhoto}">`:initials(v.ownerName)}</div>
        <div>
          <div class="card-title">${escapeHtml(v.title)}</div>
          <div class="card-meta">${escapeHtml(v.ownerName)}</div>
          <div class="card-meta">${fmtViews(v.views)} • ${timeAgo(v.createdAt)}</div>
        </div>
      </div>
    </div>`;
}
function escapeHtml(s){
  const d = document.createElement('div'); d.textContent = s||''; return d.innerHTML;
}

async function loadFeed(view){
  if(!checkConfig()) return;
  currentView = view;
  document.querySelectorAll('.sidebar a').forEach(a=>a.classList.remove('active'));
  const main = document.getElementById('mainContent');
  main.innerHTML = `<div class="empty-state"><h2>جارِ التحميل...</h2></div>`;
  try{
    let query = db.collection('videos');
    if(view==='mine' && currentUser){ query = query.where('ownerId','==',currentUser.uid); }
    query = query.orderBy(view==='trending' ? 'views' : 'createdAt','desc').limit(50);
    const snap = await query.get();
    let videos = snap.docs.map(d=>{
      const data = d.data();
      return {id:d.id, ...data, createdAt: data.createdAt ? data.createdAt.toDate() : new Date()};
    });
    allVideosCache = videos;
    if(view==='liked' && currentUser){
      const likedSnap = await db.collection('users').doc(currentUser.uid).collection('likes').get();
      const likedIds = new Set(likedSnap.docs.map(d=>d.id));
      videos = videos.filter(v=>likedIds.has(v.id));
    }
    renderGrid(videos, view==='trending' ? '🔥 الأكثر مشاهدة' : null);
  }catch(err){
    main.innerHTML = `<div class="empty-state"><h2>حدث خطأ</h2><p>${escapeHtml(err.message)}</p></div>`;
  }
}
function renderGrid(videos, heading){
  const main = document.getElementById('mainContent');
  if(!videos.length){
    main.innerHTML = `<div class="empty-state"><h2>لا توجد فيديوهات بعد</h2><p>كن أول من يرفع فيديو! اضغط على زر الرفع ⬆️ بالأعلى.</p></div>`;
    return;
  }
  main.innerHTML = (heading?`<h2 style="margin-bottom:18px;">${heading}</h2>`:'') + `<div class="grid">${videos.map(videoCardHtml).join('')}</div>`;
}

function doSearch(e){
  e.preventDefault();
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  if(!q){ goHome(); return false; }
  const filtered = allVideosCache.filter(v=>
    v.title.toLowerCase().includes(q) || (v.description||'').toLowerCase().includes(q)
  );
  renderGrid(filtered, `نتائج البحث عن "${escapeHtml(q)}"`);
  return false;
}

/* ---------- Watch page ---------- */
async function openVideo(id){
  const main = document.getElementById('mainContent');
  main.innerHTML = `<div class="empty-state"><h2>جارِ التحميل...</h2></div>`;
  window.scrollTo(0,0);
  try{
    const doc = await db.collection('videos').doc(id).get();
    if(!doc.exists){ main.innerHTML = `<div class="empty-state"><h2>الفيديو غير موجود</h2></div>`; return; }
    const v = {id:doc.id, ...doc.data()};
    v.createdAt = v.createdAt ? v.createdAt.toDate() : new Date();

    db.collection('videos').doc(id).update({views: firebase.firestore.FieldValue.increment(1)}).catch(()=>{});

    let isLiked = false;
    if(currentUser){
      const likeDoc = await db.collection('users').doc(currentUser.uid).collection('likes').doc(id).get();
      isLiked = likeDoc.exists;
    }

    const related = allVideosCache.filter(rv=>rv.id!==id).slice(0,12);

    main.innerHTML = `
      <div class="watch-layout">
        <div class="watch-main">
          <div class="player-wrap"><video src="${v.videoUrl}" controls autoplay></video></div>
          <div class="watch-title">${escapeHtml(v.title)}</div>
          <div class="watch-sub-row">
            <div class="channel-row">
              <div class="avatar">${v.ownerPhoto?`<img src="${v.ownerPhoto}">`:initials(v.ownerName)}</div>
              <div>
                <div class="channel-name">${escapeHtml(v.ownerName)}</div>
              </div>
            </div>
            <div class="action-row">
              <button class="btn-outline" id="likeBtn" onclick="toggleLike('${v.id}')">${isLiked?'💙':'👍'} <span id="likeCount">${v.likes||0}</span></button>
            </div>
          </div>
          <div class="description-box">
            <div class="stats">${fmtViews((v.views||0)+1)} • ${timeAgo(v.createdAt)}</div>
            <div>${escapeHtml(v.description||'لا يوجد وصف').replace(/\\n/g,'<br>')}</div>
          </div>

          <div class="comments-section">
            <h3 id="commentCount" style="margin-bottom:16px;">التعليقات</h3>
            <div class="comment-form">
              <div class="avatar">${currentUser?(currentUser.photoURL?`<img src="${currentUser.photoURL}">`:initials(currentUser.displayName)):'؟'}</div>
              <input type="text" id="commentInput" placeholder="${currentUser?'أضف تعليقاً...':'سجّل الدخول لإضافة تعليق'}" ${currentUser?'':'disabled'} onkeydown="if(event.key==='Enter')postComment('${v.id}')">
            </div>
            <div id="commentsList"></div>
          </div>
        </div>
        <div class="watch-sidebar" id="relatedList"></div>
      </div>`;

    document.getElementById('relatedList').innerHTML = related.map(rv=>`
      <div class="mini-card" onclick="openVideo('${rv.id}')">
        <div class="mini-thumb"><img src="${rv.thumbUrl}" onerror="this.style.display='none'"></div>
        <div>
          <div class="mini-title">${escapeHtml(rv.title)}</div>
          <div class="mini-meta">${escapeHtml(rv.ownerName)}</div>
          <div class="mini-meta">${fmtViews(rv.views)}</div>
        </div>
      </div>`).join('') || '<p style="color:var(--text-dim)">لا توجد فيديوهات أخرى</p>';

    loadComments(v.id);
  }catch(err){
    main.innerHTML = `<div class="empty-state"><h2>حدث خطأ</h2><p>${escapeHtml(err.message)}</p></div>`;
  }
}

async function toggleLike(videoId){
  if(!currentUser){ openAuth(); return; }
  const ref = db.collection('users').doc(currentUser.uid).collection('likes').doc(videoId);
  const vRef = db.collection('videos').doc(videoId);
  const existing = await ref.get();
  const btn = document.getElementById('likeBtn');
  const countEl = document.getElementById('likeCount');
  if(existing.exists){
    await ref.delete();
    await vRef.update({likes: firebase.firestore.FieldValue.increment(-1)});
    btn.innerHTML = `👍 <span id="likeCount">${Math.max(0,(+countEl.textContent||1)-1)}</span>`;
  } else {
    await ref.set({likedAt: firebase.firestore.FieldValue.serverTimestamp()});
    await vRef.update({likes: firebase.firestore.FieldValue.increment(1)});
    btn.innerHTML = `💙 <span id="likeCount">${(+countEl.textContent||0)+1}</span>`;
  }
}

async function loadComments(videoId){
  const list = document.getElementById('commentsList');
  const snap = await db.collection('videos').doc(videoId).collection('comments').orderBy('createdAt','desc').limit(100).get();
  document.getElementById('commentCount').textContent = `التعليقات (${snap.size})`;
  if(snap.empty){ list.innerHTML = `<p style="color:var(--text-dim)">كن أول من يعلّق</p>`; return; }
  list.innerHTML = snap.docs.map(d=>{
    const c = d.data();
    const created = c.createdAt ? c.createdAt.toDate() : new Date();
    return `
      <div class="comment">
        <div class="avatar">${c.userPhoto?`<img src="${c.userPhoto}">`:initials(c.userName)}</div>
        <div class="comment-body">
          <strong>${escapeHtml(c.userName)}</strong><time>${timeAgo(created)}</time>
          <p>${escapeHtml(c.text)}</p>
        </div>
      </div>`;
  }).join('');
}
async function postComment(videoId){
  if(!currentUser) return;
  const input = document.getElementById('commentInput');
  const text = input.value.trim();
  if(!text) return;
  input.value='';
  await db.collection('videos').doc(videoId).collection('comments').add({
    text, userId: currentUser.uid, userName: currentUser.displayName || 'مستخدم',
    userPhoto: currentUser.photoURL || null,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  loadComments(videoId);
}

/* ---------- Init ---------- */
if(checkConfig()){
  loadFeed('home');
} 
renderHeaderRight();
</script>
</body>
</html>
